name: lua-compile

on:
  workflow_dispatch:
    inputs:
      chunk_count:
        required: true
        default: '1'
      package_name:
        required: false
        default: 'com.fahim.myide'
      class_name:
        required: false
        default: 'LuaRunner'
      chunk_0: { required: false, default: '' }
      chunk_1: { required: false, default: '' }
      chunk_2: { required: false, default: '' }
      chunk_3: { required: false, default: '' }
      chunk_4: { required: false, default: '' }
      chunk_5: { required: false, default: '' }
      chunk_6: { required: false, default: '' }
      chunk_7: { required: false, default: '' }
      chunk_8: { required: false, default: '' }
      chunk_9: { required: false, default: '' }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup NDK
        run: |
          curl -sSL -o ndk.zip https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q ndk.zip
          echo "NDK=$PWD/android-ndk-r27c" >> $GITHUB_ENV

      - name: Download Lua 5.4.7
        run: |
          curl -sSL -o lua.tar.gz https://www.lua.org/ftp/lua-5.4.7.tar.gz
          tar xzf lua.tar.gz
          mv lua-5.4.7 lua-src

      - name: Decode payload (user lua_jni.c)
        env:
          CNT: ${{ inputs.chunk_count }}
          C0:  ${{ inputs.chunk_0 }}
          C1:  ${{ inputs.chunk_1 }}
          C2:  ${{ inputs.chunk_2 }}
          C3:  ${{ inputs.chunk_3 }}
          C4:  ${{ inputs.chunk_4 }}
          C5:  ${{ inputs.chunk_5 }}
          C6:  ${{ inputs.chunk_6 }}
          C7:  ${{ inputs.chunk_7 }}
          C8:  ${{ inputs.chunk_8 }}
          C9:  ${{ inputs.chunk_9 }}
        run: |
          mkdir -p user_jni
          python3 - "$CNT" "$C0" "$C1" "$C2" "$C3" "$C4" "$C5" "$C6" "$C7" "$C8" "$C9" << 'PY'
          import sys, base64, pathlib
          cnt = int(sys.argv[1])
          payload = "".join(sys.argv[2:2+cnt])
          for entry in payload.split("~"):
              if not entry: continue
              rel, _, b64 = entry.partition("|")
              p = pathlib.Path("user_jni") / rel
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(base64.b64decode(b64))
          print("jni files:", sum(1 for _ in pathlib.Path("user_jni").rglob("*") if _.is_file()))
          PY

      - name: Build liblua.a (arm64)
        run: |
          TC=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          CC=$TC/bin/aarch64-linux-android24-clang
          cd lua-src/src
          make clean 2>/dev/null || true
          make -j$(nproc) \
            CC="$CC" \
            AR="$TC/bin/llvm-ar rcu" \
            RANLIB="$TC/bin/llvm-ranlib" \
            MYCFLAGS="-DLUA_USE_LINUX -fPIC" \
            MYLDFLAGS="-Wl,-E" \
            liblua.a 2>&1 | tail -5
          cd ../..

      - name: Build liblua.so (user JNI + lua)
        env:
          PKG: ${{ inputs.package_name }}
          CLS: ${{ inputs.class_name }}
        run: |
          TC=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          CC=$TC/bin/aarch64-linux-android24-clang
          mkdir -p out/arm64-v8a
          JNI_SRC=$(find user_jni -name "*.c" | head -1)
          if [ -z "$JNI_SRC" ]; then
            curl -sSL -o /tmp/lua_jni.c https://raw.githubusercontent.com/fahim-git-00/MyIDE/main/app/src/main/jni/lua_jni.c
            JNI_SRC=/tmp/lua_jni.c
          fi
          # Rewrite JNI symbol to match user's package + class
          SAFE_PKG=$(echo "$PKG" | tr '.' '_')
          sed -i -E "s/Java_[A-Za-z0-9_]+_${CLS}_runScript/Java_${SAFE_PKG}_${CLS}_runScript/g" "$JNI_SRC"
          grep -o "Java_[A-Za-z0-9_]*_${CLS}_runScript" "$JNI_SRC" | head -1
          $CC -O2 -fPIC -shared \
            -I lua-src/src \
            -o out/arm64-v8a/liblua.so \
            "$JNI_SRC" \
            lua-src/src/liblua.a \
            -lm -ldl
          ls -la out/arm64-v8a/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: lua-libs-custom
          path: out/
          if-no-files-found: error
