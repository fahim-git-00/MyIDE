name: Build proot for Android arm64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Android NDK
        run: |
          mkdir -p $HOME/ndk
          cd $HOME/ndk
          wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip -q android-ndk-r26d-linux.zip
          echo "NDK=$HOME/ndk/android-ndk-r26d" >> $GITHUB_ENV

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libtalloc-dev

      - name: Build talloc for Android
        run: |
          wget -q https://download.samba.org/pub/talloc/talloc-2.4.2.tar.gz
          tar xf talloc-2.4.2.tar.gz
          cd talloc-2.4.2
          export CC=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          export AR=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          export RANLIB=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib
          export CFLAGS="-fPIE -fPIC -DHAVE_SYS_AUXV_H=1"
          export LDFLAGS="-pie -Wl,--undefined-version"
          ./configure \
            --host=aarch64-linux-android \
            --prefix=$GITHUB_WORKSPACE/talloc-out \
            --disable-python --without-gettext --disable-rpath \
            --disable-symbol-versions \
            --cross-compile --cross-execute=/bin/true \
            --builtin-libraries=replace
          make -j$(nproc)
          make install
          ls -la $GITHUB_WORKSPACE/talloc-out/include $GITHUB_WORKSPACE/talloc-out/lib

      - name: Clone proot
        run: |
          git clone --depth=1 --recursive https://github.com/termux/proot.git proot
          cd proot
          sed -i "s|/data/data/com.termux/files/applib|/data/data/com.fahim.myide/files/applib|g" src/*.c src/*.h 2>/dev/null || true; sed -i "1i #include <string.h>" src/extension/ashmem_memfd/ashmem_memfd.c
          grep -rn "com.termux" src/ || true

      - name: Build
        run: |
          cd proot/src
          mkdir -p $GITHUB_WORKSPACE/out/arm64-v8a
          CC=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CFLAGS="-O2 -fPIC -DARG_MAX=131072 -I. -I.. -I$GITHUB_WORKSPACE/talloc-out/include"
          LDFLAGS="-fPIE -pie -L$GITHUB_WORKSPACE/talloc-out/lib"
          STRIP=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip
          # Put NDK bin on PATH so `objdump` = llvm-objdump, which understands
          # aarch64 object files and emits an output format name that
          # llvm-objcopy accepts.
          # Make `objdump` resolve to llvm-objdump via a wrapper dir so the
          # Makefile's `objdump -f cli/cli.o` reports elf64-littleaarch64
          # (which llvm-objcopy accepts), not elf64-little.
          mkdir -p $GITHUB_WORKSPACE/binwrap
          ln -sf $NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objdump   $GITHUB_WORKSPACE/binwrap/objdump
          ln -sf $NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objcopy   $GITHUB_WORKSPACE/binwrap/objcopy
          ln -sf $NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf   $GITHUB_WORKSPACE/binwrap/readelf
          ln -sf $NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip     $GITHUB_WORKSPACE/binwrap/strip
          ln -sf $NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar        $GITHUB_WORKSPACE/binwrap/ar
          ln -sf $NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib    $GITHUB_WORKSPACE/binwrap/ranlib
          export PATH=$GITHUB_WORKSPACE/binwrap:$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          OBJCOPY=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objcopy
          READELF=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf
          make -j$(nproc) \
            CC=$CC \
            LD=$CC \
            STRIP=$STRIP \
            OBJCOPY=$OBJCOPY \
            READELF=$READELF \
            CFLAGS="$CFLAGS" \
            LDFLAGS="$LDFLAGS" \
            PREFIX=/data/data/com.fahim.myide/files/usr \
            V=1 || (echo "--- build failed ---"; ls; exit 1)

      - name: Collect artifacts
        run: |
          cd proot
          mkdir -p $GITHUB_WORKSPACE/out/arm64-v8a
          cp src/proot $GITHUB_WORKSPACE/out/arm64-v8a/libproot.so || true
          cp src/loader $GITHUB_WORKSPACE/out/arm64-v8a/libproot-loader.so || true
          ls -la $GITHUB_WORKSPACE/out/arm64-v8a/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: proot-arm64
          path: out/arm64-v8a/
          if-no-files-found: error
