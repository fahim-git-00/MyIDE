name: java-compile

on:
  workflow_dispatch:
    inputs:
      chunk_count: { required: true, default: '1' }
      chunk_0: { required: false, default: '' }
      chunk_1: { required: false, default: '' }
      chunk_2: { required: false, default: '' }
      chunk_3: { required: false, default: '' }
      chunk_4: { required: false, default: '' }
      chunk_5: { required: false, default: '' }
      chunk_6: { required: false, default: '' }
      chunk_7: { required: false, default: '' }
      chunk_8: { required: false, default: '' }
      chunk_9: { required: false, default: '' }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Fetch android.jar
        run: |
          mkdir -p $HOME/sdk/cmdline-tools
          cd $HOME/sdk/cmdline-tools
          curl -sSL -o cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline.zip
          mv cmdline-tools latest || true
          yes | $HOME/sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          $HOME/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" > /dev/null

      - name: Decode payload
        env:
          CNT: ${{ inputs.chunk_count }}
          C0: ${{ inputs.chunk_0 }}
          C1: ${{ inputs.chunk_1 }}
          C2: ${{ inputs.chunk_2 }}
          C3: ${{ inputs.chunk_3 }}
          C4: ${{ inputs.chunk_4 }}
          C5: ${{ inputs.chunk_5 }}
          C6: ${{ inputs.chunk_6 }}
          C7: ${{ inputs.chunk_7 }}
          C8: ${{ inputs.chunk_8 }}
          C9: ${{ inputs.chunk_9 }}
        run: |
          mkdir -p src classes java-classes deps
          python3 - "$CNT" "$C0" "$C1" "$C2" "$C3" "$C4" "$C5" "$C6" "$C7" "$C8" "$C9" << 'PY'
          import sys, base64, pathlib
          cnt = int(sys.argv[1])
          payload = "".join(sys.argv[2:2+cnt])
          # Split off optional sections: ##RUNTIMES## then ##CLASSJAR##
          runtimes_b64 = None
          if "##RUNTIMES##" in payload:
              payload, runtimes_b64 = payload.split("##RUNTIMES##", 1)
          classjar_b64 = None
          if "##CLASSJAR##" in payload:
              payload, classjar_b64 = payload.split("##CLASSJAR##", 1)
          srcpart = payload
          if classjar_b64 is not None:
              pathlib.Path("deps/deps.jar").write_bytes(base64.b64decode(classjar_b64))
              print("dep jar:", pathlib.Path("deps/deps.jar").stat().st_size, "bytes")
          if runtimes_b64 is not None:
              pathlib.Path("deps/runtimes.jar").write_bytes(base64.b64decode(runtimes_b64))
              print("runtimes jar:", pathlib.Path("deps/runtimes.jar").stat().st_size, "bytes")
          for entry in srcpart.split("~"):
              if not entry: continue
              rel, _, b64 = entry.partition("|")
              p = pathlib.Path("src") / rel
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(base64.b64decode(b64))
          print("java files:", len(list(pathlib.Path("src").rglob("*.java"))))
          PY

      - name: Compile with javac 21
        run: |
          AJ=$HOME/sdk/platforms/android-35/android.jar
          CP="$AJ"
          if [ -f deps/deps.jar ]; then CP="$CP:deps/deps.jar"; fi
          if [ -f deps/runtimes.jar ]; then CP="$CP:deps/runtimes.jar"; fi
          mkdir -p classes
          javac -d classes -classpath "$CP" --release 21 -nowarn \
            $(find src -name '*.java')
          find classes -type f | head -20

      - name: Dex with D8
        run: |
          mkdir -p dexout d8
          curl -sSL -o d8.jar https://maven.google.com/com/android/tools/r8/9.5.23/r8-9.5.23.jar
          java -cp d8.jar com.android.tools.r8.D8 \
            --release --min-api 26 --output dexout \
            --lib $HOME/sdk/platforms/android-35/android.jar \
            $(find classes -name '*.class') deps/deps.jar 2>/dev/null || \
          java -cp d8.jar com.android.tools.r8.D8 \
            --release --min-api 26 --output dexout \
            --lib $HOME/sdk/platforms/android-35/android.jar \
            $(find classes -name '*.class')

      - name: Pack
        run: |
          mkdir -p java-classes
          cp -r classes/* java-classes/
          cd dexout && zip -q ../java-classes/classes.jar classes.dex* && cd ..
          find java-classes -type f | head -20

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: java-classes
          path: java-classes/
          if-no-files-found: error
