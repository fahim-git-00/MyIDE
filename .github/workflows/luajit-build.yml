name: luajit-build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup NDK
        run: |
          curl -sSL -o ndk.zip https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q ndk.zip
          echo "NDK=$PWD/android-ndk-r27c" >> $GITHUB_ENV

      - name: Clone LuaJIT
        run: |
          git clone --depth=1 https://github.com/LuaJIT/LuaJIT.git luajit-src
          cd luajit-src
          git log -1 --oneline

      - name: Copy JNI bridge
        run: |
          curl -sSL -o luajit_jni.c https://raw.githubusercontent.com/fahim-git-00/MyIDE/main/app/src/main/jni/luajit_jni.c

      - name: Build for arm64-v8a
        run: |
          mkdir -p out/arm64-v8a
          TC=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          cd luajit-src
          make clean 2>/dev/null || true
          make -j$(nproc) \
            CC="$TC/bin/aarch64-linux-android24-clang" \
            HOST_CC="/usr/bin/gcc -m64" \
            TARGET_SYS=Linux \
            TARGET_FLAGS="" \
            XCFLAGS="-DLUAJIT_ENABLE_LUA52COMPAT -DLUAJIT_OS=Linux -fPIC" \
            TARGET_AR="$TC/bin/llvm-ar rcus" \
            TARGET_STRIP="$TC/bin/llvm-strip" \
            BUILDMODE=static 2>&1 | tail -30
          cd ..
          $TC/bin/aarch64-linux-android24-clang \
            -O2 -fPIC -shared \
            -I luajit-src/src \
            -o out/arm64-v8a/libluajit.so \
            luajit_jni.c \
            luajit-src/src/libluajit.a \
            -lm -ldl

      - name: Build for armeabi-v7a
        run: |
          mkdir -p out/armeabi-v7a
          TC=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          cd luajit-src
          make clean 2>/dev/null || true
          make -j$(nproc) \
            CC="$TC/bin/armv7a-linux-androideabi24-clang" \
            HOST_CC="/usr/bin/gcc -m64" \
            TARGET_SYS=Linux \
            TARGET_FLAGS="" \
            XCFLAGS="-DLUAJIT_ENABLE_LUA52COMPAT -DLUAJIT_OS=Linux -fPIC" \
            TARGET_AR="$TC/bin/llvm-ar rcus" \
            TARGET_STRIP="$TC/bin/llvm-strip" \
            BUILDMODE=static 2>&1 | tail -30
          cd ..
          $TC/bin/armv7a-linux-androideabi24-clang \
            -O2 -fPIC -shared \
            -I luajit-src/src \
            -o out/armeabi-v7a/libluajit.so \
            luajit_jni.c \
            luajit-src/src/libluajit.a \
            -lm -ldl

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: luajit-libs
          path: out/
          if-no-files-found: error
