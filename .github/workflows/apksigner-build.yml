name: apksigner-build

on:
  workflow_dispatch:
    inputs:
      version:
        required: false
        default: '9.4.1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          curl -sSL -o cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline.zip
          mv cmdline-tools latest || true
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "build-tools;35.0.0" > /dev/null

      - name: Grab apksig + apksigner from SDK
        env:
          VER: ${{ inputs.version }}
        run: |
          # apksig jar from Maven
          curl -sSL -o apksig.jar "https://dl.google.com/dl/android/maven2/com/android/tools/build/apksig/$VER/apksig-$VER.jar"
          # apksigner CLI jar from build-tools
          cp $HOME/android-sdk/build-tools/35.0.0/lib/apksigner.jar apksigner.jar
          ls -la apksig.jar apksigner.jar

      - name: Bundle + dex
        run: |
          mkdir -p fat dexout
          cd fat
          jar xf ../apksig.jar 2>&1 | tail -2 || true
          jar xf ../apksigner.jar 2>&1 | tail -2 || true
          find . -name "*.class" | wc -l
          jar cf ../apksigner-full.jar .
          cd ..
          ls -la apksigner-full.jar
          $HOME/android-sdk/build-tools/35.0.0/d8 --release --min-api 24 --output dexout apksigner-full.jar
          ls -la dexout/
          cd dexout && zip -q ../apksigner-full-dexed.jar classes.dex* && cd ..
          ls -la apksigner-full-dexed.jar

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: apksigner-9-4-1
          path: apksigner-full-dexed.jar
          if-no-files-found: error
