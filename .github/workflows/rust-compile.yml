name: rust-compile

on:
  workflow_dispatch:
    inputs:
      chunk_count: { required: true, default: '1' }
      crate_name:  { required: false, default: 'native' }
      lib_name:    { required: false, default: 'native' }
      chunk_0: { required: false, default: '' }
      chunk_1: { required: false, default: '' }
      chunk_2: { required: false, default: '' }
      chunk_3: { required: false, default: '' }
      chunk_4: { required: false, default: '' }
      chunk_5: { required: false, default: '' }
      chunk_6: { required: false, default: '' }
      chunk_7: { required: false, default: '' }
      chunk_8: { required: false, default: '' }
      chunk_9: { required: false, default: '' }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache cargo-ndk
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-${{ runner.os }}

      - name: Install cargo-ndk
        run: |
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            cargo install cargo-ndk --locked
          fi

      - name: Install NDK
        run: |
          curl -sSL -o ndk.zip https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q ndk.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r27c" >> $GITHUB_ENV
          echo "NDK_HOME=$PWD/android-ndk-r27c" >> $GITHUB_ENV

      - name: Decode payload
        env:
          CNT: ${{ inputs.chunk_count }}
          C0: ${{ inputs.chunk_0 }}
          C1: ${{ inputs.chunk_1 }}
          C2: ${{ inputs.chunk_2 }}
          C3: ${{ inputs.chunk_3 }}
          C4: ${{ inputs.chunk_4 }}
          C5: ${{ inputs.chunk_5 }}
          C6: ${{ inputs.chunk_6 }}
          C7: ${{ inputs.chunk_7 }}
          C8: ${{ inputs.chunk_8 }}
          C9: ${{ inputs.chunk_9 }}
        run: |
          mkdir -p crate/src
          python3 - "$CNT" "$C0" "$C1" "$C2" "$C3" "$C4" "$C5" "$C6" "$C7" "$C8" "$C9" << 'PY'
          import sys, base64, pathlib
          cnt = int(sys.argv[1])
          payload = "".join(sys.argv[2:2+cnt])
          for entry in payload.split("~"):
              if not entry: continue
              rel, _, b64 = entry.partition("|")
              if rel.endswith(".rs"):
                  rel = "src/" + pathlib.Path(rel).name
              p = pathlib.Path("crate") / rel
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(base64.b64decode(b64))
          print("files:", sum(1 for _ in pathlib.Path("crate").rglob("*") if _.is_file()))
          PY

      - name: Build
        env:
          LIB_NAME: ${{ inputs.lib_name }}
        run: |
          cd crate
          if [ ! -f Cargo.toml ]; then
            cat > Cargo.toml <<CFG
          [package]
          name = "rustnative"
          version = "0.1.0"
          edition = "2021"

          [lib]
          name = "${LIB_NAME}"
          crate-type = ["cdylib"]

          [profile.release]
          lto = true
          opt-level = "z"
          strip = true
          CFG
          fi
          cargo ndk -t arm64-v8a -t armeabi-v7a -o ../out build --release

      - name: Pack
        run: find out -type f -name "*.so" || true

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: rust-libs
          path: out/
          if-no-files-found: error
