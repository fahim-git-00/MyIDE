name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9

      - name: Install Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools latest
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" > /dev/null

      - name: Write local.properties
        run: echo "sdk.dir=$HOME/android-sdk" > local.properties

      - name: Remove Termux-only aapt2 override
        run: |
          grep -v "aapt2FromMavenOverride" gradle.properties > gradle.properties.new || true
          mv gradle.properties.new gradle.properties

      - name: Dex Kotlin compiler for on-device use
        run: |
          cd app/src/main/assets/kotlin
          ls -lh
          $HOME/android-sdk/build-tools/34.0.0/d8 \
            --min-api 24 \
            --lib $HOME/android-sdk/platforms/android-34/android.jar \
            --output ./dexout \
            kotlin-compiler-embeddable.jar
          cd dexout
          ls -lh
          zip -q -X ../kotlin-compiler-embeddable-dexed.jar *.dex
          cd ..
          mv kotlin-compiler-embeddable-dexed.jar kotlin-compiler-embeddable.jar
          rm -rf dexout
          ls -lh

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: myide-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
