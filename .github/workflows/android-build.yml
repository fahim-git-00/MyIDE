name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9

      - name: Install Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools latest
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" > /dev/null

      - name: Write local.properties
        run: echo "sdk.dir=$HOME/android-sdk" > local.properties

      - name: Remove Termux-only aapt2 override
        run: |
          grep -v "aapt2FromMavenOverride" gradle.properties > gradle.properties.new || true
          mv gradle.properties.new gradle.properties

      - name: Dex Kotlin jars
        run: |
          cd app/src/main/assets/kotlin
          D8=$HOME/android-sdk/build-tools/34.0.0/d8
          LIB=$HOME/android-sdk/platforms/android-34/android.jar

          dexjar() {
            J=$1; M=$2
            [ ! -f "$J" ] && { echo "skip $J"; return; }
            mv "$J" orig.jar
            rm -rf tmp && mkdir tmp
            $D8 --min-api $M --lib $LIB --output tmp/ orig.jar
            unzip -q -o orig.jar -d tmp
            (cd tmp && zip -q -X -r "../$J" .)
            rm -rf tmp orig.jar
            echo "dexed $J (min-api=$M): $(ls -lh $J | awk '{print $5}')"
          }

          dexjar kotlin-compiler-embeddable.jar 26
          dexjar kotlin-stdlib.jar 24
          dexjar kotlin-reflect.jar 24
          dexjar kotlin-script-runtime.jar 24
          ls -lh

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: myide-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
