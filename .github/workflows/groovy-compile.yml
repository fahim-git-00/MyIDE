name: groovy-compile

on:
  workflow_dispatch:
    inputs:
      chunk_count: { required: true, default: '1' }
      chunk_0: { required: false, default: '' }
      chunk_1: { required: false, default: '' }
      chunk_2: { required: false, default: '' }
      chunk_3: { required: false, default: '' }
      chunk_4: { required: false, default: '' }
      chunk_5: { required: false, default: '' }
      chunk_6: { required: false, default: '' }
      chunk_7: { required: false, default: '' }
      chunk_8: { required: false, default: '' }
      chunk_9: { required: false, default: '' }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch android.jar
        run: |
          mkdir -p $HOME/sdk/cmdline-tools
          cd $HOME/sdk/cmdline-tools
          curl -sSL -o cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline.zip
          mv cmdline-tools latest || true
          yes | $HOME/sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          $HOME/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" > /dev/null

      - name: Decode payload
        env:
          CNT: ${{ inputs.chunk_count }}
          C0: ${{ inputs.chunk_0 }}
          C1: ${{ inputs.chunk_1 }}
          C2: ${{ inputs.chunk_2 }}
          C3: ${{ inputs.chunk_3 }}
          C4: ${{ inputs.chunk_4 }}
          C5: ${{ inputs.chunk_5 }}
          C6: ${{ inputs.chunk_6 }}
          C7: ${{ inputs.chunk_7 }}
          C8: ${{ inputs.chunk_8 }}
          C9: ${{ inputs.chunk_9 }}
        run: |
          mkdir -p src classes groovy-classes libs
          python3 - "$CNT" "$C0" "$C1" "$C2" "$C3" "$C4" "$C5" "$C6" "$C7" "$C8" "$C9" << 'PY'
          import sys, base64, pathlib
          cnt = int(sys.argv[1])
          payload = "".join(sys.argv[2:2+cnt])
          for entry in payload.split("~"):
              if not entry: continue
              rel, _, b64 = entry.partition("|")
              p = pathlib.Path("src") / rel
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(base64.b64decode(b64))
          PY

      - name: Fetch Groovy 4.0.26
        run: |
          cd libs
          BASE=https://repo1.maven.org/maven2/org/apache/groovy
          VER=4.0.26
          for J in groovy groovy-xml groovy-json groovy-nio groovy-macro groovy-templates groovy-sql groovy-ant groovy-groovydoc groovy-dateutil groovy-datetime groovy-jmx groovy-test groovy-console groovy-cli-picocli groovy-cli-commons; do
            curl -sSL -f -o $J-$VER.jar $BASE/$J/$VER/$J-$VER.jar || true
          done
          curl -sSL -f -o asm-9.7.jar          https://repo1.maven.org/maven2/org/ow2/asm/asm/9.7/asm-9.7.jar
          curl -sSL -f -o asm-tree-9.7.jar     https://repo1.maven.org/maven2/org/ow2/asm/asm-tree/9.7/asm-tree-9.7.jar
          curl -sSL -f -o asm-analysis-9.7.jar https://repo1.maven.org/maven2/org/ow2/asm/asm-analysis/9.7/asm-analysis-9.7.jar
          curl -sSL -f -o asm-util-9.7.jar     https://repo1.maven.org/maven2/org/ow2/asm/asm-util/9.7/asm-util-9.7.jar
          curl -sSL -f -o asm-commons-9.7.jar  https://repo1.maven.org/maven2/org/ow2/asm/asm-commons/9.7/asm-commons-9.7.jar

      - name: Compile
        run: |
          AJ=$HOME/sdk/platforms/android-35/android.jar
          CP=$(ls libs/*.jar | tr '\n' ':')
          java -cp "$CP" org.codehaus.groovy.tools.FileSystemCompiler \
            --classpath "$AJ" -d classes $(find src -name '*.groovy')

      - name: Pack runtime as flat class jar
        run: |
          mkdir -p runtime_extract
          cd runtime_extract
          for j in ../libs/groovy-4.0.26.jar ../libs/groovy-xml-4.0.26.jar ../libs/groovy-json-4.0.26.jar; do
            [ -f "$j" ] && unzip -oq "$j" || true
          done
          find . -name "module-info.class" -delete
          rm -rf META-INF
          zip -q -r ../groovy-classes/groovy-runtime.jar .
          cd ..
          cp -r classes/* groovy-classes/ 2>/dev/null || true
          echo "groovy-runtime.jar has flat classes:"
          unzip -l groovy-classes/groovy-runtime.jar | head -20

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: groovy-classes
          path: groovy-classes/
          if-no-files-found: error
