name: ecj-build

on:
  workflow_dispatch:
    inputs:
      version:
        required: false
        default: '3.46.100'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK (for D8)
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          curl -sSL -o cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline.zip
          mv cmdline-tools latest || true
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "build-tools;35.0.0" > /dev/null

      - name: Download ECJ jar
        env:
          VER: ${{ inputs.version }}
        run: |
          curl -sSL -o ecj.jar "https://repo1.maven.org/maven2/org/eclipse/jdt/ecj/$VER/ecj-$VER.jar"
          ls -la ecj.jar

      - name: Extract resources (messages.properties etc)
        run: |
          mkdir -p resout
          cd resout
          # Extract only .properties and .rsc resources
          unzip -o ../ecj.jar "*.properties" "*.rsc" > /dev/null 2>&1 || true
          find . -type f | wc -l
          cd ..
          cd resout && zip -q -r ../ecj_res.zip . && cd ..

      - name: Dex ECJ with D8
        run: |
          mkdir -p dexout
          D8=$HOME/android-sdk/build-tools/35.0.0/d8
          $D8 --release --min-api 24 --output dexout ecj.jar 2>&1 | tail -10
          ls -la dexout/

      - name: Pack ecj_full.jar (dex form)
        run: |
          cd dexout
          zip -q ../ecj_full.jar classes.dex
          cd ..

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ecj-${{ inputs.version }}
          path: |
            ecj_full.jar
            ecj_res.zip
          if-no-files-found: error
