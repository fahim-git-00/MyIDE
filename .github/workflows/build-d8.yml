name: build-d8

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download R8 9.5.23
        run: |
          curl -sSL -o r8.jar "https://maven.google.com/com/android/tools/r8/9.5.23/r8-9.5.23.jar"
          ls -la r8.jar

      - name: Download boot D8 (old dexed jar as reference)
        run: |
          # Get D8 8.7.18 which we already have — dex it fresh
          curl -sSL -o d8-old.jar "https://maven.google.com/com/android/tools/r8/8.7.18/r8-8.7.18.jar"
          ls -la d8-old.jar

      - name: Dex R8 9.5.23 using old D8 8.7.18
        run: |
          # Use old R8 jar (pure Java classes) to dex new one
          # R8 jar contains D8 class which can dex itself
          java -cp d8-old.jar com.android.tools.r8.D8 \
            --release \
            --min-api 24 \
            --output d8out \
            --lib /dev/null \
            r8.jar

      - name: Pack output
        run: |
          cd d8out
          zip -q ../d8-9.5.23.zip classes.dex classes2.dex 2>/dev/null || zip -q ../d8-9.5.23.zip classes.dex
          cd ..
          ls -la d8-9.5.23.zip

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: d8-9-5-23
          path: d8-9.5.23.zip
          if-no-files-found: error
