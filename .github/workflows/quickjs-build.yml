name: quickjs-build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup NDK
        run: |
          curl -sSL -o ndk.zip https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q ndk.zip
          echo "NDK=$PWD/android-ndk-r27c" >> $GITHUB_ENV

      - name: Clone QuickJS
        run: |
          git clone --depth=1 https://github.com/bellard/quickjs.git quickjs-src

      - name: Generate config.h
        run: |
          cd quickjs-src
          # Generate config.h / version header without full build
          make -n > /dev/null 2>&1 || true
          # Fallback: write minimal config
          if [ ! -f config.h ]; then
            cat > config.h << 'CFG'
          #ifndef CONFIG_VERSION
          #define CONFIG_VERSION "2024-01-13"
          #endif
          #define CONFIG_BIGNUM 1
          #define CONFIG_ATOMICS 1
          CFG
          fi
          cd ..

      - name: Copy JNI bridge
        run: |
          curl -sSL -o quickjs_jni.c https://raw.githubusercontent.com/fahim-git-00/MyIDE/main/app/src/main/jni/quickjs_jni.c

      - name: Build for arm64-v8a
        run: |
          mkdir -p out/arm64-v8a
          CC=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          $CC -O2 -fPIC -shared \
              -I quickjs-src \
              -DCONFIG_VERSION='"2024-01-13"' \
                            -o out/arm64-v8a/libquickjs.so \
              quickjs-src/quickjs.c \
              quickjs-src/libregexp.c \
              quickjs-src/libunicode.c \
              quickjs-src/cutils.c \
              quickjs-src/quickjs-libc.c \
              quickjs_jni.c \
              -lm -ldl

      - name: Build for armeabi-v7a
        run: |
          mkdir -p out/armeabi-v7a
          CC=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi24-clang
          $CC -O2 -fPIC -shared \
              -I quickjs-src \
              -DCONFIG_VERSION='"2024-01-13"' \
                            -o out/armeabi-v7a/libquickjs.so \
              quickjs-src/quickjs.c \
              quickjs-src/libregexp.c \
              quickjs-src/libunicode.c \
              quickjs-src/cutils.c \
              quickjs-src/quickjs-libc.c \
              quickjs_jni.c \
              -lm -ldl

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: quickjs-libs
          path: out/
          if-no-files-found: error
