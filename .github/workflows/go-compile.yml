name: go-compile

on:
  workflow_dispatch:
    inputs:
      chunk_count: { required: true, default: '1' }
      module_name: { required: false, default: 'native' }
      chunk_0: { required: false, default: '' }
      chunk_1: { required: false, default: '' }
      chunk_2: { required: false, default: '' }
      chunk_3: { required: false, default: '' }
      chunk_4: { required: false, default: '' }
      chunk_5: { required: false, default: '' }
      chunk_6: { required: false, default: '' }
      chunk_7: { required: false, default: '' }
      chunk_8: { required: false, default: '' }
      chunk_9: { required: false, default: '' }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Install NDK
        run: |
          curl -sSL -o ndk.zip https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q ndk.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r27c" >> $GITHUB_ENV
          echo "ANDROID_HOME=$PWD/android-sdk" >> $GITHUB_ENV

      - name: Decode payload
        env:
          CNT: ${{ inputs.chunk_count }}
          C0: ${{ inputs.chunk_0 }}
          C1: ${{ inputs.chunk_1 }}
          C2: ${{ inputs.chunk_2 }}
          C3: ${{ inputs.chunk_3 }}
          C4: ${{ inputs.chunk_4 }}
          C5: ${{ inputs.chunk_5 }}
          C6: ${{ inputs.chunk_6 }}
          C7: ${{ inputs.chunk_7 }}
          C8: ${{ inputs.chunk_8 }}
          C9: ${{ inputs.chunk_9 }}
        run: |
          mkdir -p gomod
          python3 - "$CNT" "$C0" "$C1" "$C2" "$C3" "$C4" "$C5" "$C6" "$C7" "$C8" "$C9" << 'PY'
          import sys, base64, pathlib
          cnt = int(sys.argv[1])
          payload = "".join(sys.argv[2:2+cnt])
          for entry in payload.split("~"):
              if not entry: continue
              rel, _, b64 = entry.partition("|")
              p = pathlib.Path("gomod") / rel
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(base64.b64decode(b64))
          print("files:", sum(1 for _ in pathlib.Path("gomod").rglob("*") if _.is_file()))
          PY

      - name: Build
        env:
          MODULE_NAME: ${{ inputs.module_name }}
        run: |
          cd gomod
          if [ ! -f go.mod ]; then
            go mod init "$MODULE_NAME"
          fi
          go mod tidy 2>/dev/null || true
          gomobile init
          mkdir -p ../out/arm64-v8a ../out/armeabi-v7a
          gomobile bind -target=android/arm64 -androidapi 24 -o ../out/arm64-v8a/libgo.so ./... \
            || echo "gomobile arm64 failed, falling back"
          if [ ! -f ../out/arm64-v8a/libgo.so ]; then
            for pkg in $(go list ./...); do
              name=$(basename "$pkg")
              GOOS=android GOARCH=arm64 CGO_ENABLED=1 \
                CC=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang \
                go build -buildmode=c-shared -o ../out/arm64-v8a/lib${name}.so "$pkg" \
                || echo "c-shared failed for $pkg"
            done
          fi
          ls -la ../out/arm64-v8a/

      - name: Pack
        run: find out -type f -name "*.so" || true

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: go-libs
          path: out/
          if-no-files-found: error
